name: ci
on: [push, pull_request]

jobs:
  test:
    name: build & test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose
      - if: runner.os != 'Windows'
        run: cargo test --verbose -- --test-threads=1
      - if: runner.os == 'Windows'
        run: >-
          cargo test --verbose -- --test-threads=1
          --skip net::controller::tests
          --skip net::share::tests
          --skip server::tools::tests
          --skip core_remote_assist
      - if: runner.os == 'Windows'
        run: cargo test --verbose --lib net::controller::tests::matching_token_renews_before_and_after_expiry -- --exact
      - if: runner.os == 'Windows'
        run: cargo test --verbose --lib net::controller::tests::old_token_is_busy_after_takeover -- --exact
      - if: runner.os == 'Windows'
        run: cargo test --verbose --lib net::controller::tests::explicit_disconnect_releases_only_matching_token -- --exact
      - if: runner.os == 'Windows'
        run: cargo test --verbose --lib net::controller::tests::running_operation_prevents_mid_command_lease_takeover -- --exact
