name: release

# Триггер: пуш тега вида v1.2.3 (или ручной запуск). Собирает статичные бинари
# под 4 платформы и прикладывает их к GitHub Release с тем же тегом.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # создание релиза + загрузка ассетов

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: micromanager-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: micromanager-macos-aarch64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            asset: micromanager-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: micromanager-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl → полностью статичный Linux-бинарь (crypto-бэкенд ring собирается под musl).
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          dir="target/${{ matrix.target }}/release"
          tar -czf "${{ matrix.asset }}" -C "$dir" micromanager
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/micromanager.exe"
          Compress-Archive -Path $bin -DestinationPath "${{ matrix.asset }}" -Force
          $h = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}").Hash.ToLower()
          "$h  ${{ matrix.asset }}" | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
