[package]
name = "micromanager"
version = "0.0.3"
edition = "2021"
description = "Кросс-платформенные «руки для LLM» — лёгкий безопасный MCP-сервер исполнения. Тонкие руки, сменный мозг."
license = "MIT OR Apache-2.0"
repository = "https://github.com/metalebedenko/micromanager"
readme = "README.md"
keywords = ["mcp", "llm", "agent", "remote", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "1.7.0", features = ["server", "client", "transport-io", "macros"] }
schemars = "1.2.1"
# HTTP к LLM-провайдерам. rustls вместо OpenSSL — кросс-платформа без C-зависимостей.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
iroh = "1.0.0"        # P2P-транспорт (dial-by-key сквозь NAT)
rand = "0.9"          # одноразовый pairing-секрет
# unstable-rendered-line-info: Paragraph::line_count — реальное число строк после wrap (скролл).
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
directories = "6"     # платформенная папка состояния
fs2 = "0.4"            # кросс-платформенный process lock session-store
# Опт-ин шифрование iroh-ключа парольной фразой (pure-Rust, без C-зависимостей).
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
# системный буфер обмена — копировать код-приглашение из TUI.
# default-features=false: нужен только текст, без тяжёлой image-data зависимости.
arboard = { version = "3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"           # terminate the whole remote-command process group on shutdown

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true        # меньше бинарь для дистрибуции
lto = "thin"
